[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safi-cli"
version = "0.1.0"
description = "SAFi Governed Coding Assistant CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "rich>=13.0.0",
]

[project.scripts]
safi = "safi_cli.main:main"

[tool.setuptools.packages.find]
include = ["safi_cli*"]
