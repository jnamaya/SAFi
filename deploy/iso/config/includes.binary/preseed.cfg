# SAFi Appliance — debian-installer preseed.
#
# Lives in config/includes.binary/ (→ ISO root /preseed.cfg) NOT
# config/preseed/: lb chroot_preseed validates whatever sits in config/preseed/
# with debconf-set-selections in the build chroot, where d-i's netcfg templates
# are absent and every `d-i <question> seen true` line aborts the build
# ("Cannot find a question for …"). At install time the templates exist, so the
# seen lines behave; 055-installer-initrd-preseed.binary also bakes this file
# into the d-i initrd so preseed/file=/preseed.cfg works before /cdrom mounts.
#
# Goals: unattended install to the first disk, minimal branded system, no
# operator account created by d-i (the appliance ships its own `admin` account
# and sets its password on first boot, so no default credentials exist on the
# ISO). The SAFi bootstrap itself (repo clone, venv, systemd units) is baked
# into the live rootfs by config/hooks/, and the live-installer copies that
# rootfs to disk — so the installed system needs no network to build SAFi.

#### Localisation ####
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

#### Installer theme ####
# cdebconf's newt frontend ignores NEWT_COLORS: it replaces the whole palette
# itself and only honors the debconf question debian-installer/theme (exported
# by S65theme as FRONTEND_BACKGROUND). "dark" selects the built-in dark
# palette (root white-on-black), which 055-installer-initrd-preseed.binary
# recolors to SAFi green accents.
d-i debian-installer/theme string dark

#### Network (installer) ####
# The install is FULLY offline (rootfs/grub/packages ship on the ISO — see hook
# 050-offline-apt + apt.conf.d/95-safi-offline), so the installer's networking
# is pure convenience and must never block or prompt.
#
# Default policy: DHCP, and DHCP is what the installer actually attempts.
# netcfg ALWAYS runs autoconfiguration first ("Commencing network
# autoconfiguration on <iface>") because netcfg/disable_autoconfig is false.
# Only if that FAILS does it show the netcfg/dhcp_failed note and consult
# netcfg/dhcp_options. So dhcp_options is purely the failure-path answer and
# cannot override a working DHCP.
#
# The exact value must be one of the question's real choices. Verified against
# netcfg_1.197 templates shipped on this ISO:
#   Choices: Retry network autoconfiguration,
#            Retry network autoconfiguration with a DHCP hostname,
#            Configure network manually,           <-- d-i's DEFAULT
#            ${wifireconf},
#            Do not configure the network at this time
# Do NOT invent a label here. A `select` value that is not in Choices is
# discarded, and because the question is marked `seen` debconf then falls back
# to the DEFAULT "Configure network manually" -- which lands the operator in
# the static-address prompt with a blank field. That is a silent, confusing
# failure. tests/check-preseed-selects.py guards against it by validating
# every select value in this file against the real templates shipped on the
# ISO, and build.sh runs it on every build.
#
# We choose "Do not configure the network at this time" rather than "Retry
# network autoconfiguration" on purpose: retry loops forever when no DHCP
# server exists (air-gapped install, VirtualBox host-only), which would hang
# an unattended install. This way:
#   DHCP server present  -> netcfg keeps the lease, writes `iface <nic> inet dhcp`
#   no DHCP server       -> install completes, NIC has no address, console
#                           prints the exact `safi network set` commands
# Static sites configure themselves explicitly after install:
#   safi network set static <iface> <cidr> <gateway> <dns>
#   safi network diff && safi network apply
# There is deliberately NO hardcoded address in this file.
d-i netcfg/choose_interface select auto
d-i netcfg/hostname string safi
d-i netcfg/get_hostname string safi
d-i netcfg/get_domain string local
d-i netcfg/get_hostname seen true
d-i netcfg/get_domain seen true
d-i netcfg/hostname seen true
d-i netcfg/dhcp_timeout string 15
d-i netcfg/disable_autoconfig boolean false
# Failure path is fully pre-answered => zero interaction either way.
d-i netcfg/dhcp_failed note
d-i netcfg/dhcp_failed seen true
d-i netcfg/dhcp_options select Do not configure the network at this time
d-i netcfg/dhcp_options seen true

#### Post-install: leave the target able to ask for an address ####
# "Do not configure the network at this time" is the right answer for the
# INSTALLER -- a retry loop would hang an unattended install on an air-gapped
# network. But it is the wrong thing to leave behind on disk: netcfg writes an
# interfaces file with nothing in it but loopback, so the installer attempts
# DHCP exactly once and no boot after that ever tries again. Observed on
# Hyper-V: install offline, no address, cable reconnected, reboot, still no
# address -- the link is up and permanently unconfigured.
#
# The documented recovery (`safi network set dhcp <iface> && safi network
# apply`) is unreachable in exactly that state, because the admin password is
# only unlocked by the browser setup page, which needs an IP to load. So the
# fix is to make the box self-healing rather than to rely on the operator.
#
# For each interface the target has hardware for, append a DHCP-on-link stanza
# ONLY if that interface has no stanza at all. An existing stanza -- static or
# DHCP, whether the installer or the operator wrote it -- is never touched, and
# no address is ever guessed. `allow-hotplug` rather than `auto` so ifupdown
# brings the NIC up from the udev link event instead of during boot, which
# means a DHCP server that never answers cannot hold up the boot.
#
# safi-net-prep does the same check on every boot; this just means the very
# first boot is already correct.
d-i preseed/late_command string F=/target/etc/network/interfaces; [ -f "$F" ] || exit 0; for n in $(ls /sys/class/net 2>/dev/null | grep -v '^lo$'); do if ! grep -qE "^[[:space:]]*(auto|allow-hotplug|iface)[[:space:]]+$n([[:space:]]|$)" "$F"; then printf '\n# Added by the SAFi installer: this interface had no\n# configuration, so nothing would ever have requested an address.\n# Change with: safi network set <method> ... && safi network apply\nallow-hotplug %s inet dhcp\n' "$n" >> "$F"; fi; done; true

#### Virtual hardware firmware probe ####
# Do not scan the target disk or floppy for optional firmware media. The
# appliance ISO carries the required installer components, and VirtualBox has
# no removable firmware device to probe.
d-i hw-detect/load_firmware boolean false

#### Offline package source ####
# The live rootfs already contains the appliance and its runtime packages.
# Never make first installation depend on an external Debian mirror.
d-i apt-setup/use_mirror boolean false
d-i apt-setup/no_mirror boolean true
d-i apt-setup/services-select multiselect
d-i apt-setup/cdrom/set-first boolean true
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false

#### Account setup ####
# Root login disabled. Preseed user creation so user-setup runs 100% hands-off.
# The user's password is locked (*); the appliance's own first-boot wizard
# configures administrator credentials on first boot.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string SAFi Admin
d-i passwd/username string safiadmin
d-i passwd/user-password-crypted string *

#### Clock & timezone ####
# Fully answer every question clock-setup-udeb / tzsetup-udeb can raise, and
# mark them seen so none re-prompts. Two reasons this was leaking while the rest
# of the install stayed unattended:
#   * clock-setup-udeb's NTP-sync question is CRITICAL priority, so it is NOT
#     suppressed by priority=critical; leaving it unseeded made d-i re-ask it
#     under "Configure the clock".
#   * a critical question whose preseeded value fails the template's validation
#     is re-asked even in auto mode. Use the real zoneinfo basename Etc/UTC (not
#     the bare "UTC", which some tzsetup builds reject) and disable hardware-
#     clock auto-detection so the value is used verbatim.
# The install is fully offline (rootfs + grub ship on the ISO), so NTP sync is
# not needed here; the running appliance syncs time itself.
d-i clock-setup/utc-auto boolean false
d-i clock-setup/utc boolean true
d-i clock-setup/utc seen true
d-i clock-setup/ntp boolean false
d-i clock-setup/ntp seen true
d-i clock-setup/ntp-sync boolean false
d-i clock-setup/ntp-sync seen true
d-i time/zone string Etc/UTC
d-i time/zone seen true

#### Partitioning — one disk, single filesystem (Trixbox-style simplicity) ####
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/disk string /dev/sda
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

#### Base system ####
# The live rootfs ALREADY contains the appliance and its full package set, so
# live-installer simply copies it to disk. Never let d-i/tasksel resolve or
# download anything from a mirror during install — that is what hung the offline
# appliance at "updating the list of available packages" and then failed the
# GRUB step. Select no extra task and skip every post-install network pass.
d-i base-installer/install-recommends boolean false
d-i tasksel/first multiselect
d-i pkgsel/desktop multiselect
d-i pkgsel/include string
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
d-i pkgsel/install-language-support boolean false
# Install the live-build appliance rootfs onto the target disk. Without this,
# the netinst path would install Debian's base system but omit SAFi.
d-i live-installer/enable boolean true

#### GRUB on the first disk ####
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/sda

#### Finish ####
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/halt boolean false

#### Preseed chain: fetch nothing at install time; everything is on the ISO ####
d-i preseed/include string
