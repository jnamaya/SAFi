# SAFi Appliance reverse proxy.
# The temporary browser setup service and the final app both listen on
# 127.0.0.1:5001; the service owning that port changes after setup completes.
<VirtualHost *:80>
    ServerName runsafi.local
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=302,L]

    ErrorLog ${APACHE_LOG_DIR}/safi-error.log
    CustomLog ${APACHE_LOG_DIR}/safi-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName safi.local
    SSLEngine on
    SSLCertificateFile /etc/ssl/runsafi/appliance.crt
    SSLCertificateKeyFile /etc/ssl/runsafi/appliance.key
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass /api/ http://127.0.0.1:5001/api/
    ProxyPassReverse /api/ http://127.0.0.1:5001/api/
    ProxyPass / http://127.0.0.1:5001/
    ProxyPassReverse / http://127.0.0.1:5001/

    ErrorLog ${APACHE_LOG_DIR}/safi-error.log
    CustomLog ${APACHE_LOG_DIR}/safi-access.log combined
</VirtualHost>
</IfModule>
