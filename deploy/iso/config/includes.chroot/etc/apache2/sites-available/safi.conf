# SAFi Appliance — Apache reverse proxy (DEPLOY_BAREMETAL.md step 8).
# The app listens on 127.0.0.1:5001 and this vhost terminates :80. This file is
# packed into the ISO by includes.chroot and enabled by
# config/hooks/normal/040-appliance-surface.chroot (a2ensite safi).
#
# NOTE /api/ must be proxied before the catch-all. /scim/v2 rides the catch-all.
# Add TLS (letsencrypt) and flip X-Forwarded-Proto to https for production.
<VirtualHost *:80>
    ServerName safi.local

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass /api/ http://127.0.0.1:5001/api/
    ProxyPassReverse /api/ http://127.0.0.1:5001/api/
    ProxyPass /     http://127.0.0.1:5001/
    ProxyPassReverse /     http://127.0.0.1:5001/

    ErrorLog ${APACHE_LOG_DIR}/safi-error.log
    CustomLog ${APACHE_LOG_DIR}/safi-access.log combined
</VirtualHost>