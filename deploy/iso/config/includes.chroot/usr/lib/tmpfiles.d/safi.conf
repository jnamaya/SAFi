# SAFi backup spool. /var/backups is root-only, and the backup timer and
# `safi backup` run as the unprivileged `safi` user, so the spool directory is
# created here at boot (systemd-tmpfiles runs as root) with group-write for the
# safi user and group-read for operators who list dumps.
d /var/backups/safi 0775 root safi -