# SAFi Appliance — debian-installer preseed.
#
# Goals: unattended install to the first disk, minimal branded system, no
# operator account created by d-i (the appliance ships its own `admin` account
# and sets its password on first boot, so no default credentials exist on the
# ISO). The SAFi bootstrap itself (repo clone, venv, systemd units) is baked
# into the live rootfs by config/hooks/, and the live-installer copies that
# rootfs to disk — so the installed system needs no network to build SAFi.

#### Localisation ####
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

#### Network ####
d-i netcfg/choose_interface select auto
d-i netcfg/hostname string safi
d-i netcfg/get_domain string local
# The configured hostname is used by the installed system regardless.

#### Mirror (used only to satisfy preseed questions) ####
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

#### Account setup ####
# No d-i-created user: the appliance ships its own `admin` (sudo) account and
# the service account `safi` (nologin, see deploy/systemd/*). `admin`'s
# password is set by the first-boot wizard; before that it is locked.
d-i passwd/root-login boolean false
d-i user-setup/allow-login boolean false
d-i user-setup/enable-password boolean true

#### Clock & timezone ####
d-i clock-setup/utc boolean true
d-i time/zone string UTC

#### Partitioning — one disk, single filesystem (Trixbox-style simplicity) ####
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/disk string /dev/sda
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

#### Base system ####
d-i base-installer/install-recommends boolean false

#### GRUB on the first disk ####
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/sda

#### Finish ####
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/halt boolean false

#### Preseed chain: fetch nothing at install time; everything is on the ISO ####
d-i preseed/include string