# SAFi Appliance — debian-installer preseed.
#
# Goals: unattended install to the first disk, minimal branded system, no
# operator account created by d-i (the appliance ships its own `admin` account
# and sets its password on first boot, so no default credentials exist on the
# ISO). The SAFi bootstrap itself (repo clone, venv, systemd units) is baked
# into the live rootfs by config/hooks/, and the live-installer copies that
# rootfs to disk — so the installed system needs no network to build SAFi.

#### Localisation ####
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

#### Installer theme ####
# cdebconf's newt frontend ignores NEWT_COLORS: it replaces the whole palette
# itself and only honors the debconf question debian-installer/theme (exported
# by S65theme as FRONTEND_BACKGROUND). "dark" selects the built-in dark
# palette (root white-on-black), which 055-installer-initrd-preseed.binary
# recolors to SAFi green accents.
d-i debian-installer/theme string dark

#### Network ####
d-i netcfg/choose_interface select auto
d-i netcfg/hostname string safi
d-i netcfg/get_hostname string safi
d-i netcfg/get_domain string local
# Mark hostname/domain as seen so netcfg never opens a dialog for them, even
# when it falls back to the manual path (no DHCP on the segment).
d-i netcfg/get_hostname seen true
d-i netcfg/get_domain seen true
d-i netcfg/hostname seen true
# Hands-off fallback when DHCP never answers (bare link / lab segment). netcfg
# raises two critical dialogs on a failed autoconfiguration:
#   netcfg/dhcp_failed  ("Network autoconfiguration failed" notification)
#   netcfg/dhcp_options ("Configure ... manually / Do not configure")
# Both are suppressed and re-answered here, so an unattended install never
# stalls on a no-DHCP link. The static values below then apply with every
# question marked seen (value present + seen = the frontend skips it, so no
# "press Enter on the pre-filled value" steps either). DHCP still wins on
# segments that have it — these questions are only reached if DHCP truly
# failed — and normal deployments overlay the values per-site. (The install is
# fully offline — rootfs, grub and packages ship on the ISO — so the live-session
# network is convenience only and never a dependency.)
d-i netcfg/dhcp_timeout string 15
d-i netcfg/no_default_route boolean true
d-i netcfg/disable_autoconfig boolean false
d-i netcfg/dhcp_failed seen true
d-i netcfg/dhcp_options select Configure network manually
d-i netcfg/dhcp_options seen true
d-i netcfg/confirm_static boolean true
d-i netcfg/confirm_static seen true
d-i netcfg/get_ipaddress string 192.168.56.10
d-i netcfg/get_ipaddress seen true
d-i netcfg/get_netmask string 255.255.255.0
d-i netcfg/get_netmask seen true
d-i netcfg/get_gateway string 192.168.56.1
d-i netcfg/get_gateway seen true
d-i netcfg/get_nameservers string 192.168.56.1
d-i netcfg/get_nameservers seen true

#### Virtual hardware firmware probe ####
# Do not scan the target disk or floppy for optional firmware media. The
# appliance ISO carries the required installer components, and VirtualBox has
# no removable firmware device to probe.
d-i hw-detect/load_firmware boolean false

#### Offline package source ####
# The live rootfs already contains the appliance and its runtime packages.
# Never make first installation depend on an external Debian mirror.
d-i apt-setup/use_mirror boolean false
d-i apt-setup/no_mirror boolean true
d-i apt-setup/services-select multiselect
d-i apt-setup/cdrom/set-first boolean true
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false

#### Account setup ####
# Root login disabled. Preseed user creation so user-setup runs 100% hands-off.
# The user's password is locked (*); the appliance's own first-boot wizard
# configures administrator credentials on first boot.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string SAFi Admin
d-i passwd/username string safiadmin
d-i passwd/user-password-crypted string *

#### Clock & timezone ####
d-i clock-setup/utc boolean true
d-i time/zone string UTC

#### Partitioning — one disk, single filesystem (Trixbox-style simplicity) ####
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/disk string /dev/sda
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

#### Base system ####
d-i base-installer/install-recommends boolean false
d-i tasksel/first multiselect standard
# Never select a desktop task on the appliance installer.
d-i pkgsel/desktop multiselect
# Install the live-build appliance rootfs onto the target disk. Without this,
# the netinst path would install Debian's base system but omit SAFi.
d-i live-installer/enable boolean true

#### GRUB on the first disk ####
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/sda

#### Finish ####
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/halt boolean false

#### Preseed chain: fetch nothing at install time; everything is on the ISO ####
d-i preseed/include string
